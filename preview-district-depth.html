<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>THE MANIPUR | District Intelligence Preview</title>
<meta name="robots" content="noindex,nofollow">
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#080b0f}
iframe{width:100%;height:100%;height:100dvh;border:0;display:block;background:#080b0f}
#failure{position:fixed;inset:auto 15px 15px;z-index:100;background:#171d23;color:#eae4d7;border:1px solid #71624a;padding:11px 15px;font:12px Arial,sans-serif;display:none}
</style>
</head>
<body>
<iframe id="manipur-live-preview" title="Manipur intelligence terminal — live baseline with district dossier enhancement" src="./" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" loading="eager"></iframe>
<div id="failure" role="alert">District preview enhancement could not be loaded. The original terminal is still visible.</div>
<script>
(function(){
 "use strict";
 var f=document.getElementById("manipur-live-preview"),ready=false;
 function inject(){
  if(ready)return;
  var d;
  try{d=f.contentDocument;if(!d||!d.documentElement||!d.getElementById("drawer"))throw Error("Terminal not ready");}
  catch(e){document.getElementById("failure").style.display="block";return;}
  ready=true;
  /* The production terminal already loads these exact enhancement assets. */
  if(d.querySelector('script[src*="preview-district-depth.js"]'))return;
  var css=d.createElement("link");css.rel="stylesheet";css.href="./preview-district-depth.css?v=20261121-a";
  css.onerror=function(){document.getElementById("failure").style.display="block";};
  d.head.appendChild(css);
  var js=d.createElement("script");js.src="./preview-district-depth.js?v=20261121-a";
  js.onerror=function(){document.getElementById("failure").style.display="block";};
  d.body.appendChild(js);
 }
 f.addEventListener("load",inject);
})();
</script>
</body>
</html>
